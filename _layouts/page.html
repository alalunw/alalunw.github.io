---
layout: default
---

<div class="page-layout">
  <header class="page-header animate-in">
    <h1 class="page-header__title">{{ page.title }}</h1>
    {% if page.subtitle %}
    <p class="page-header__subtitle">{{ page.subtitle }}</p>
    {% endif %}
  </header>

  <div class="page-content reveal">
    {{ content }}
  </div>
</div>
