<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
<head>
<script>
(function(){
var t=localStorage.getItem('tit-theme');
if(t==='dark'||(!t&&window.matchMedia('(prefers-color-scheme:dark)').matches)){
document.documentElement.setAttribute('data-theme','dark')
}
document.documentElement.classList.remove('no-js');
if(document.body){document.body.classList.remove('no-js')}
})();
</script>
{% include head-seo.html %}
{% seo %}
<title>{% if page.title %}{{ page.title | escape }} — {% endif %}{{ site.title | escape | replace: '_', ' ' }}</title>
<link rel="stylesheet" href="{{ '/assets/css/base.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
<script src="{{ '/assets/js/theme.js' | relative_url }}" defer></script>
<script src="{{ '/assets/js/lightbox.js' | relative_url }}" defer></script>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to content</a>
  {% include header.html %}

  <main id="main-content" role="main" aria-label="Content">
    {{ content }}
  </main>

  {% include footer.html %}
</body>
</html>
