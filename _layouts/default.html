<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
<head>
  <script>
    (function(){var t=localStorage.getItem('tit-theme');if(t==='dark'||(!t&&window.matchMedia('(prefers-color-scheme:dark)').matches)){document.documentElement.setAttribute('data-theme','dark')}})();
  </script>
  {% include head-seo.html %}
  {% seo %}
  <title>{% if page.title %}{{ page.title | escape }} — {% endif %}{{ site.title | escape | replace: '_', ' ' }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <script src="{{ '/assets/js/theme.js' | relative_url }}" defer></script>
</head>
<body>
  {% include header.html %}

  <main role="main" aria-label="Content">
    {{ content }}
  </main>

  {% include footer.html %}
</body>
</html>
