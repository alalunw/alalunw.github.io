<div class="speech-player" data-speech-player>
  <button class="speech-player__toggle" type="button" aria-label="Listen to this post" data-speech-toggle>
    <svg class="speech-player__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
      <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
    </svg>
    <span class="speech-player__label">Listen</span>
  </button>
  
  <div class="speech-player__controls" data-speech-controls hidden>
    <button class="speech-player__btn speech-player__btn--play" type="button" data-speech-play aria-label="Play">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
        <polygon points="5 3 19 12 5 21 5 3"></polygon>
      </svg>
    </button>
    
    <button class="speech-player__btn speech-player__btn--pause" type="button" data-speech-pause hidden aria-label="Pause">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
        <rect x="6" y="4" width="4" height="16"></rect>
        <rect x="14" y="4" width="4" height="16"></rect>
      </svg>
    </button>
    
    <div class="speech-player__field">
      <label class="speech-player__field-label">Speed</label>
      <select class="speech-player__select" data-speech-speed aria-label="Playback speed">
        <option value="0.5">0.5</option>
        <option value="0.75">0.75</option>
        <option value="1" selected>1</option>
        <option value="1.25">1.25</option>
        <option value="1.5">1.5</option>
        <option value="2">2</option>
      </select>
    </div>
    
    <div class="speech-player__field">
      <label class="speech-player__field-label">Vol</label>
      <input class="speech-player__volume" type="range" min="0" max="1" step="0.1" value="1" data-speech-volume aria-label="Volume">
    </div>
    
    <span class="speech-player__status" data-speech-status aria-live="polite"></span>
  </div>
</div>
