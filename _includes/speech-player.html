<div class="speech-player" data-speech-player>
  <div class="speech-player__main">

    <button class="speech-player__play-btn" type="button" aria-label="Play" data-speech-play>
      <svg class="speech-player__icon--play" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
      <svg class="speech-player__icon--pause" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" hidden><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
    </button>

    <div class="speech-player__progress-container">
      <div class="speech-player__progress-bar">
        <div class="speech-player__progress" data-speech-progress></div>
      </div>
      <div class="speech-player__meta">
        <span class="speech-player__time" data-speech-time>0:00</span>
        <span class="speech-player__separator">/</span>
        <span class="speech-player__duration" data-speech-duration>0:00</span>
      </div>
    </div>

    <div class="speech-player__controls-row">
      <div class="speech-player__control-group">
        <svg class="speech-player__control-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
        <input class="speech-player__volume-slider" type="range" min="0" max="1" step="0.1" value="1" data-speech-volume aria-label="Volume">
      </div>
      <div class="speech-player__control-group">
        <svg class="speech-player__control-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        <select class="speech-player__speed-select" data-speech-speed aria-label="Playback speed">
          <option value="0.5">0.5×</option>
          <option value="0.75">0.75×</option>
          <option value="1" selected>1×</option>
          <option value="1.25">1.25×</option>
          <option value="1.5">1.5×</option>
          <option value="2">2×</option>
        </select>
      </div>
    </div>

  </div>
</div>
