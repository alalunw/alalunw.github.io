<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 }}">
<meta name="author" content="{{ site.author.name }}">
<link rel="alternate" type="application/rss+xml" title="{{ site.title | escape }}" href="{{ '/feed.xml' | relative_url }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">

<!-- Favicon & Branding -->
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/img/brand/tit.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/img/brand/tit.png' | relative_url }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/img/brand/tit.png' | relative_url }}">
<link rel="shortcut icon" href="{{ '/assets/img/brand/tit.png' | relative_url }}">
<meta name="theme-color" content="#c45d3e">
