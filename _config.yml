# Thoughts In Tremolo — Site Configuration
# A refined digital garden at the intersection of technology, culture, and human experience.

title: Thoughts_In_Tremolo
email: connorhall96@gmail.com
description: >-
  Thoughtful essays, visual storytelling, and project-based explorations
  at the intersection of technology, culture, and the human experience.
baseurl: ""
url: "https://alalunw.github.io"

# Author
author:
  name: AlaluNW
  twitter: alalunw
  github: alalunw

# Social
twitter_username: alalunw
github_username: alalunw

# Build settings
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Permalinks
permalink: /:year/:month/:day/:title/

# Collections
collections:
  projects:
    output: true
    permalink: /projects/:name/
  media:
    output: true
    permalink: /media/:name/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      category: "essay"
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "post"
      category: "project"
  - scope:
      path: ""
      type: "media"
    values:
      layout: "post"
      category: "media"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

# Theme configuration
theme_config:
  accent_color: "#c45d3e"
  enable_animations: true
  show_reading_time: true
  font_display: "Playfair Display"
  font_body: "Source Serif 4"

# Exclude from processing
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
